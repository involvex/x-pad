name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  publish-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test --nologo -v q

      - name: Publish framework-dependent win-x64
        run: pwsh scripts/publish-win-x64.ps1 -Mode framework

      - name: Publish self-contained win-x64
        run: pwsh scripts/publish-win-x64.ps1 -Mode selfcontained

      - name: Zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath xpad-win-x64.zip -Force
          Compress-Archive -Path publish/win-x64-sc/* -DestinationPath xpad-win-x64-selfcontained.zip -Force

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            xpad-win-x64.zip
            xpad-win-x64-selfcontained.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  store:
    needs: publish-win-x64
    runs-on: windows-latest
    env:
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
    steps:
      # secrets cannot be referenced in job-level if:; hoist to env and gate steps.
      - name: Check Partner Center secrets
        id: gate
        shell: pwsh
        run: |
          $ready =
            -not [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_TENANT_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_SELLER_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_CLIENT_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_CLIENT_SECRET)
          if (-not $ready) {
            Write-Host "Partner Center secrets missing — skipping Store submit."
          }
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack unsigned Store MSIX
        if: steps.gate.outputs.ready == 'true'
        run: pwsh scripts/publish-msix.ps1 -SkipSign

      - name: Setup Microsoft Store Developer CLI
        if: steps.gate.outputs.ready == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Submit to the Store
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"
          $msix = Get-ChildItem publish\xpad-*-win-x64.msix | Select-Object -First 1
          if (-not $msix) { throw "No MSIX found under publish/" }
          msstore publish $msix.FullName -id 9P88NMM8F1WL
