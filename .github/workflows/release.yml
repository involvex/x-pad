name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  publish-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test --nologo -v q

      - name: Publish framework-dependent win-x64
        run: pwsh scripts/publish-win-x64.ps1 -Mode framework

      - name: Publish self-contained win-x64
        run: pwsh scripts/publish-win-x64.ps1 -Mode selfcontained

      - name: Zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath xpad-win-x64.zip -Force
          Compress-Archive -Path publish/win-x64-sc/* -DestinationPath xpad-win-x64-selfcontained.zip -Force

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            xpad-win-x64.zip
            xpad-win-x64-selfcontained.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
